<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - BUSSID Ventures</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0f;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(18, 24, 36, 0.7);
      border: 1px solid rgba(124, 255, 0, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(16px);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: rgba(124, 255, 0, 0.1);
      border: 1px solid rgba(124, 255, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: #7cff00;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    .highlight {
      color: #7cff00;
    }
    p {
      color: rgba(243, 244, 246, 0.6);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #7cff00;
      color: #0a0a0f;
      font-weight: 800;
      font-family: monospace, monospace;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.8rem 1.75rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(124, 255, 0, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      background: #00ff88;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
    }
    .tip {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      font-family: monospace, monospace;
      color: rgba(243, 244, 246, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are <span class="highlight">Offline</span></h1>
    <p>
      Unable to reach BUSSID Ventures servers. Check your WiFi or mobile data connection and try again.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div class="tip">
      BUSSID Ventures Progressive Web App
    </div>
  </div>
</body>
</html>

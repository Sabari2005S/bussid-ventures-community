<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#11141e" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#7cff00" />
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a364a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Cyber Ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Glowing Accent Hex / Grid hints -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#7cff00" stroke-opacity="0.08" stroke-width="40" />

  <!-- BUS ICON SILHOUETTE (Cyber BUSSID Coach) -->
  <g filter="url(#glow)">
    <!-- Bus Body Outline -->
    <path d="M150 110 C150 90, 180 80, 256 80 C332 80, 362 90, 362 110 L372 320 C372 340, 360 350, 340 350 L340 380 C340 395, 320 395, 320 380 L320 350 L192 350 L192 380 C192 395, 172 395, 172 380 L172 350 C152 350, 140 340, 140 320 Z" 
          fill="#121824" stroke="url(#neonGrad)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Destination Board -->
    <rect x="186" y="102" width="140" height="28" rx="6" fill="#05070a" stroke="#7cff00" stroke-width="2" />
    <text x="256" y="122" font-family="monospace, sans-serif" font-size="14" font-weight="900" fill="#7cff00" text-anchor="middle" letter-spacing="3">BUSSID</text>

    <!-- Windshield Glass -->
    <path d="M166 142 L346 142 L340 230 C340 240, 330 246, 256 246 C182 246, 172 240, 172 230 Z" fill="url(#windshieldGrad)" stroke="#00f0ff" stroke-width="3" />

    <!-- Center Windshield Wiper divider -->
    <line x1="256" y1="145" x2="256" y2="244" stroke="#0a1826" stroke-width="4" />

    <!-- Dual Headlights -->
    <!-- Left Headlight Cluster -->
    <polygon points="160,285 205,285 195,305 160,305" fill="#7cff00" />
    <circle cx="175" cy="295" r="5" fill="#ffffff" />
    <!-- Right Headlight Cluster -->
    <polygon points="352,285 307,285 317,305 352,305" fill="#7cff00" />
    <circle cx="337" cy="295" r="5" fill="#ffffff" />

    <!-- Front Grille -->
    <rect x="220" y="285" width="72" height="20" rx="4" fill="#080b12" stroke="#7cff00" stroke-width="2" />
    <line x1="232" y1="295" x2="280" y2="295" stroke="#7cff00" stroke-width="2" />

    <!-- Side Mirrors -->
    <!-- Left Mirror -->
    <path d="M148 155 C125 150, 115 170, 118 195 C120 205, 130 205, 132 195 C132 180, 138 170, 148 168 Z" fill="#7cff00" />
    <!-- Right Mirror -->
    <path d="M364 155 C387 150, 397 170, 394 195 C392 205, 382 205, 380 195 C380 180, 374 170, 364 168 Z" fill="#7cff00" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">VENTURES</text>
  <text x="256" y="465" font-family="monospace, sans-serif" font-size="14" font-weight="700" fill="#7cff00" text-anchor="middle" letter-spacing="8">COMMUNITY</text>
</svg>
